name: Update internship listings

on:
  schedule:
    - cron: "0 1 * * *"        # daily at 01:00 UTC
  workflow_dispatch: {}         # allow manual runs from the Actions tab

permissions:
  contents: write               # needed to commit regenerated files

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python -m src.main

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README-Inactive.md data/listings.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update listings ($(date -u +%Y-%m-%d))"
            git push
          fi
